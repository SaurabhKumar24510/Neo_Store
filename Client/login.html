<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - NeoStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loginstyle.css">
</head>
<body class="p-5">

  <!-- Center message box -->
  <div id="message-box" class="message-box d-none"></div>

  <h2>Login</h2>
  <form id="loginForm" class="w-50">
    <input type="email" class="form-control mb-3" placeholder="Email" id="email" required />
    <input type="password" class="form-control mb-3" placeholder="Password" id="password" required />
    <button class="btn btn-success" type="submit">Login</button>
  </form>

  <p class="mt-3">New user? <a href="signup.html">Signup</a></p>

  <script>
    // ✅ Centered Message Function
    function showMessage(message) {
      const msgBox = document.getElementById("message-box");
      msgBox.textContent = message;
      msgBox.classList.remove("d-none");
      msgBox.classList.add("show");

      setTimeout(() => {
        msgBox.classList.remove("show");
        msgBox.classList.add("d-none");
      }, 2500); // message hides after 2.5 seconds
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("user", JSON.stringify(data.user));
          showMessage("Login successfully ✅");

          setTimeout(() => {
            window.location.href = "index.html";
          }, 2500);
        } else {
          alert(data.message || "Login failed");
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    });
  </script>
</body>
</html>
